<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMBOOK - Digital Study Portal</title>
  <link rel="icon" type="image/png" href="sambok_logo-removebg-preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #10b981 100%);
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --syn-color: #059669;
      --syn-bg: #ecfdf5;
      --ant-color: #dc2626;
      --ant-bg: #fef2f2;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 15px 30px -5px rgba(79, 70, 229, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', 'Hind Siliguri', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      border: none;
      background: #f1f5f9;
      color: #334155;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .nav-btn:hover, .nav-btn.active {
      background: #4f46e5;
      color: #ffffff;
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
      flex: 1;
      width: 100%;
    }

    /* Hero / Header */
    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Breadcrumbs */
    .breadcrumb-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .breadcrumb-nav span {
      cursor: pointer;
      transition: color 0.2s;
    }

    .breadcrumb-nav span:hover {
      color: var(--primary);
    }

    .breadcrumb-nav .active-crumb {
      color: var(--text-main);
      font-weight: 600;
      cursor: default;
    }

    /* Selection Cards (Subjects / Papers / Chapters) */
    .grid-selection {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      margin-top: 15px;
    }

    .select-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px 22px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .select-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--primary-gradient);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .select-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: #cbd5e1;
    }

    .select-card:hover::before {
      opacity: 1;
    }

    .card-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .select-card h3 {
      font-size: 1.22rem;
      font-weight: 700;
      color: #0f172a;
    }

    .select-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card-badge {
      margin-top: auto;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      background: #eef2ff;
      padding: 4px 10px;
      border-radius: 6px;
    }

    /* Controls Bar (Vocab Search) */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      background: #fff;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .stats {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--primary);
      background: #eef2ff;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* Vocab Grid & Cards */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .vocab-card {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .vocab-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
      gap: 8px;
    }

    .word-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
    }

    .meaning-badge {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary);
      background: #f5f3ff;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #ede9fe;
    }

    .section-block {
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.88rem;
    }

    .synonyms {
      background: var(--syn-bg);
      border-left: 4px solid var(--syn-color);
    }

    .antonyms {
      background: var(--ant-bg);
      border-left: 4px solid var(--ant-color);
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .synonyms .section-title { color: var(--syn-color); }
    .antonyms .section-title { color: var(--ant-color); }
    .tags { color: #334155; line-height: 1.45; }

    /* ICT Lecture View Styles */
    .lecture-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    .lecture-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 26px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .lecture-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 14px;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lecture-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1e1b4b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-badge {
      font-size: 0.85rem;
      font-weight: 600;
      color: #6366f1;
      background: #eef2ff;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .lecture-content ul {
      list-style-type: none;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lecture-content li {
      position: relative;
      padding-left: 24px;
      line-height: 1.7;
      color: #334155;
      font-size: 0.98rem;
    }

    .lecture-content li::before {
      content: '•';
      position: absolute;
      left: 6px;
      color: var(--primary);
      font-size: 1.4rem;
      line-height: 1.2;
    }

    .highlight-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 12px;
      font-size: 0.95rem;
    }

    .math-formula {
      font-family: 'Poppins', monospace;
      font-weight: 600;
      color: #4338ca;
      background: #eef2ff;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin: 2px 0;
    }

    .base-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 0.93rem;
    }

    .base-table th, .base-table td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }

    .base-table th {
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 700;
    }

    .base-table tr:hover {
      background: #f8fafc;
    }

    /* Empty state */
    .empty-state {
      background: #fff;
      border-radius: 16px;
      padding: 50px 20px;
      text-align: center;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .empty-state h3 {
      font-size: 1.3rem;
      color: #1e293b;
      margin-bottom: 8px;
    }

    /* Footer */
    footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 18px 20px;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    @media (max-width: 640px) {
      .nav-container { flex-direction: column; gap: 12px; }
      .container { padding: 20px 14px; }
      .hero h1 { font-size: 1.6rem; }
      .vocab-grid { grid-template-columns: 1fr; }
      .lecture-card { padding: 18px; }
    }
  </style>
</head>

                      <strong>পূর্ণসংখ্যার ক্ষেত্রে:</strong> সংখ্যাটিকে ক্রমাগত ২ দিয়ে ভাগ করতে হবে এবং ভাগশেষগুলো সংরক্ষণ করতে হবে । ভাগফল ০ না হওয়া পর্যন্ত এই প্রক্রিয়া চলবে।
                    </p>
                    <p style="margin-top: 5px;">
                      ভাগশেষগুলো <strong>নিচ থেকে উপরে</strong> সাজিয়ে লিখতে হয় (সবার নিচেরটি <strong>MSB - Most Significant Bit</strong> এবং ওপরেরটি <strong>LSB - Least Significant Bit</strong>) ।
                    </p>
                    <div class="highlight-box">
                      <strong>উদাহরণ :</strong><br>
                      <span class="math-formula">(99)<sub>10</sub> = (1100011)<sub>2</sub></span>
                    </div>
                  </li>

                  <li style="margin-top: 16px;">
                    <strong style="font-size: 1.05rem; color: #4338ca;">খ) দশমিক থেকে অক্টাল (Decimal to Octal): </strong>
                    <p style="margin-top: 5px;">
                      <strong>পূর্ণসংখ্যার ক্ষেত্রে:</strong> সংখ্যাটিকে ক্রমাগত ৮ দিয়ে ভাগ করে ভাগশেষগুলো নিচ থেকে উপরে সাজাতে হবে (<strong>MSD - Most Significant Digit</strong> থেকে <strong>LSD - Least Significant Digit</strong>) ।
                    </p>
                    <div class="highlight-box">
                      <strong>উদাহরণ :</strong><br>
                      <span class="math-formula">(469)<sub>10</sub> = (725)<sub>8</sub></span>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
            <!-- Card 5: Homework Section -->
            <div class="lecture-card" style="border: 2px dashed #6366f1; background: #fafafa; margin-top: 20px;">

              </div>
              <div class="lecture-content">
                <div style="margin-bottom: 20px;">
                  <h4 style="color: #4338ca; margin-bottom: 8px;">ক) দশমিক থেকে বাইনারিতে রূপান্তর করো (Decimal to Binary):</h4>
                  <p style="font-size: 0.95rem; line-height: 1.8; color: #1e293b;">
                    <strong>১.</strong> (35)<sub>10</sub> &nbsp;&nbsp;|&nbsp;&nbsp;

                </div>

                <div>
                  <h4 style="color: #4338ca; margin-bottom: 8px;">খ) দশমিক থেকে অক্টালে রূপান্তর করো (Decimal to Octal):</h4>
                  <p style="font-size: 0.95rem; line-height: 1.8; color: #1e293b;">
                    <strong>১.</strong> (55)<sub>10</sub> &nbsp;&nbsp;|&nbsp;&nbsp;
                    <strong>২.</strong> (92)<sub>10</sub> &nbsp;&nbsp;|&nbsp;&nbsp;

                    <strong>৬.</strong> (230)<sub>10</sub> &nbsp;&nbsp;|&nbsp;&nbsp;
                    <strong>৭.</strong> (312)<sub>10</sub> &nbsp;&nbsp;|&nbsp;&nbsp;
                    <strong>৮.</strong> (385)<sub>10</sub> &nbsp;&nbsp;|&nbsp;&nbsp;
                    <strong>৯.</strong> (420)<sub>10</sub> &nbsp;&nbsp;|&nbsp;&nbsp;
                    <strong>১০.</strong> (550)<sub>10</sub>
                  </p>
                </div>
              </div>
            </div>

          </div>
        `;
      }
      else if (route.startsWith('ict-chapter-')) {
        const chNum = parseInt(route.replace('ict-chapter-', ''));
        const chapter = ictChapters.find(c => c.id === chNum);
        setActiveNav('ict');
        renderBreadcrumb([
          { name: 'Home', route: 'home' },
          { name: 'ICT', route: 'ict' },
          { name: `Chapter ${chNum}`, route }
        ]);
        app.innerHTML = `
          <div class="hero">
            <h1>${chapter ? chapter.title : `Chapter ${chNum}`}</h1>
            <p>${chapter ? chapter.desc : ''}</p>

          <div class="empty-state">
            <div style="font-size: 3rem; margin-bottom: 12px;">💡</div>
            <h3>Chapter ${chNum} Handnotes & Questions</h3>
            <p>এই অধ্যায়ের লেকচার ও প্র্যাকটিস শিট খুব শীঘ্রই যুক্ত করা হবে।</p>
          </div>
        `;
      }
    }

    function renderVocabList(items) {
      const container = document.getElementById('vocabGridContainer');
      const stats = document.getElementById('vocabStats');
      if (!container) return;

      container.innerHTML = "";
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'vocab-card';
        card.innerHTML = `
          <div class="word-header">
            <span class="word-text">${item.word}</span>
            <span class="meaning-badge">${item.meaning}</span>
          </div>
          <div class="section-block synonyms">
            <div class="section-title">✦ Synonyms</div>
            <div class="tags">${item.syn}</div>
          </div>
          <div class="section-block antonyms">
            <div class="section-title">✕ Antonyms</div>
            <div class="tags">${item.ant}</div>
          </div>
        `;
        container.appendChild(card);
      });

      if (stats) stats.innerText = `Showing: ${items.length} Words`;
    }

    function handleVocabSearch(query) {
      const q = query.trim().toLowerCase();
      const filtered = vocabData.filter(item => 
        item.word.toLowerCase().includes(q) ||
        item.meaning.toLowerCase().includes(q) ||
        item.syn.toLowerCase().includes(q) ||
        item.ant.toLowerCase().includes(q)
      );
      renderVocabList(filtered);
    }

    // Initialize Home
    navigateTo('home');
  </script>
