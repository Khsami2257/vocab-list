<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMBOOK - Digital Study Portal</title>
  <link rel="icon" type="image/png" href="sambok_logo-removebg-preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #10b981 100%);
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --syn-color: #059669;
      --syn-bg: #ecfdf5;
      --ant-color: #dc2626;
      --ant-bg: #fef2f2;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 15px 30px -5px rgba(79, 70, 229, 0.12);
    }
    /* Dark Mode Theme Variables */
    body.dark-mode {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --syn-bg: #064e3b;
      --ant-bg: #7f1d1d;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    body.dark-mode .navbar,
    body.dark-mode .select-card,
    body.dark-mode .vocab-card,
    body.dark-mode .lecture-card,
    body.dark-mode .controls,
    body.dark-mode footer {
      background: #1e293b;
      border-color: #334155;
      color: #f8fafc;
    }

    body.dark-mode .hero h1,
    body.dark-mode .select-card h3,
    body.dark-mode .lecture-title,
    body.dark-mode .word-text {
      color: #f8fafc;
    }

    body.dark-mode .search-box input {
      background: #0f172a;
      border-color: #334155;
      color: #f8fafc;
    }

    body.dark-mode .highlight-box,
    body.dark-mode .base-table th,
    body.dark-mode .base-table td {
      background: #0f172a;
      border-color: #334155;
      color: #e2e8f0;
    }

    body.dark-mode .tags {
      color: #cbd5e1;
    }
body.dark-mode .lecture-content li,
    body.dark-mode .lecture-content p,
    body.dark-mode .lecture-content strong,
    body.dark-mode .lecture-content span {
      color: #e2e8f0 !important;
    }

    body.dark-mode .highlight-box {
      background: #0f172a !important;
      border-color: #334155 !important;
      color: #f1f5f9 !important;
    }

    body.dark-mode .highlight-box strong {
      color: #ffffff !important;
    }
    /* Homework Card & Answer Box Dark Theme */
    body.dark-mode .lecture-card[style*="dashed"] {
      background: #1e293b !important;
      border-color: #6366f1 !important;
    }

    body.dark-mode .lecture-card[style*="dashed"] h4,
    body.dark-mode .lecture-card[style*="dashed"] p,
    body.dark-mode .lecture-card[style*="dashed"] strong {
      color: #e2e8f0 !important;
    }

    body.dark-mode #hw-answers {
      background: #0f172a !important;
      border-color: #334155 !important;
      color: #cbd5e1 !important;
    }

    body.dark-mode #hw-answers p {
      color: #818cf8 !important;
    }
    /* Math Formula Dark Mode Fix */
    body.dark-mode .math-formula {
      background: rgba(99, 102, 241, 0.2) !important;
      color: #818cf8 !important;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }
    body.dark-mode .nav-btn {
      background: #334155;
      color: #e2e8f0;
    }

    body.dark-mode .nav-btn:hover,
    body.dark-mode .nav-btn.active {
      background: #4f46e5;
      color: #ffffff;
    }

    /* Dark Mode Toggle Button */
    .theme-toggle-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    body.dark-mode .theme-toggle-btn {
      background: #334155;
      border-color: #475569;
      color: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', 'Hind Siliguri', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      border: none;
      background: #f1f5f9;
      color: #334155;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .nav-btn:hover, .nav-btn.active {
      background: #4f46e5;
      color: #ffffff;
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
      flex: 1;
      width: 100%;
    }

    /* Hero / Header */
    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Breadcrumbs */
    .breadcrumb-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .breadcrumb-nav span {
      cursor: pointer;
      transition: color 0.2s;
    }

    .breadcrumb-nav span:hover {
      color: var(--primary);
    }

    .breadcrumb-nav .active-crumb {
      color: var(--text-main);
      font-weight: 600;
      cursor: default;
    }

    /* Selection Cards (Subjects / Papers / Chapters) */
    .grid-selection {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      margin-top: 15px;
    }

    .select-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px 22px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .select-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--primary-gradient);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .select-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: #cbd5e1;
    }

    .select-card:hover::before {
      opacity: 1;
    }

    .card-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .select-card h3 {
      font-size: 1.22rem;
      font-weight: 700;
      color: #0f172a;
    }

    .select-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card-badge {
      margin-top: auto;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      background: #eef2ff;
      padding: 4px 10px;
      border-radius: 6px;
    }

    /* Controls Bar (Vocab Search) */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      background: #fff;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .stats {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--primary);
      background: #eef2ff;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* Vocab Grid & Cards */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .vocab-card {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .vocab-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
      gap: 8px;
    }

    .word-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
    }

    .meaning-badge {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary);
      background: #f5f3ff;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #ede9fe;
    }

    .section-block {
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.88rem;
    }

    .synonyms {
      background: var(--syn-bg);
      border-left: 4px solid var(--syn-color);
    }

    .antonyms {
      background: var(--ant-bg);
      border-left: 4px solid var(--ant-color);
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .synonyms .section-title { color: var(--syn-color); }
    .antonyms .section-title { color: var(--ant-color); }
    .tags { color: #334155; line-height: 1.45; }

    /* ICT Lecture View Styles */
    .lecture-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    .lecture-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 26px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .lecture-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 14px;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lecture-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1e1b4b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-badge {
      font-size: 0.85rem;
      font-weight: 600;
      color: #6366f1;
      background: #eef2ff;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .lecture-content ul {
      list-style-type: none;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lecture-content li {
      position: relative;
      padding-left: 24px;
      line-height: 1.7;
      color: #334155;
      font-size: 0.98rem;
    }

    .lecture-content li::before {
      content: '•';
      position: absolute;
      left: 6px;
      color: var(--primary);
      font-size: 1.4rem;
      line-height: 1.2;
    }

    .highlight-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 12px;
      font-size: 0.95rem;
    }

    .math-formula {
      font-family: 'Poppins', monospace;
      font-weight: 600;
      color: #4338ca;
      background: #eef2ff;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin: 2px 0;
    }

    .base-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 0.93rem;
    }

    .base-table th, .base-table td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }

    .base-table th {
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 700;
    }

    .base-table tr:hover {
      background: #f8fafc;
    }

    /* Empty state */
    .empty-state {
      background: #fff;
      border-radius: 16px;
      padding: 50px 20px;
      text-align: center;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .empty-state h3 {
      font-size: 1.3rem;
      color: #1e293b;
      margin-bottom: 8px;
    }

    /* Footer */
    footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 18px 20px;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    @media (max-width: 640px) {
      .nav-container { flex-direction: column; gap: 12px; }
      .container { padding: 20px 14px; }
      .hero h1 { font-size: 1.6rem; }
      .vocab-grid { grid-template-columns: 1fr; }
      .lecture-card { padding: 18px; }
    }
  </style>
</head>

/* --- SMART VOCABULARY MCQ EXAM ENGINE (GOAL & ERROR-TARGETED RETAKE) --- */

let examCurrentBatchIndex = 0; // 0: 1-20, 1: 21-40, 2: 41-60, 3: 61-72
let examActiveQuestions = [];
let examWrongQuestions = [];
let examScore = 0;
let examAnsweredCount = 0;
let isRetakeMode = false;

// Goal Batches Configuration
const examBatches = [
  { name: "Goal 1", rangeText: "Words 01 - 20", start: 0, end: 20 },
  { name: "Goal 2", rangeText: "Words 21 - 40", start: 20, end: 40 },
  { name: "Goal 3", rangeText: "Words 41 - 60", start: 40, end: 60 },
  { name: "Goal 4", rangeText: "Words 61 - 72", start: 60, end: 72 }
];

function startVocabExam(batchIdx = 0, customQuestionList = null) {
  examCurrentBatchIndex = batchIdx;
  const batch = examBatches[batchIdx];

  if (customQuestionList) {
    examActiveQuestions = customQuestionList;
    isRetakeMode = true;
  } else {
    isRetakeMode = false;
    const targetWords = vocabData.slice(batch.start, batch.end);
    examActiveQuestions = [];

    // Prottek word-er jonno 1ta Synonym ebong 1ta Antonym banano
    targetWords.forEach((item, i) => {
      // 1. Synonym Question
      if (item.syn && item.syn !== "N/A") {
        const correctSyn = item.syn.split(',')[0].trim();
        const otherWords = vocabData.filter(v => v.word !== item.word && v.syn && v.syn !== "N/A");
        const shuffledOthers = [...otherWords].sort(() => 0.5 - Math.random());
        const w1 = shuffledOthers[0].syn.split(',')[0].trim();
        const w2 = shuffledOthers[1] ? shuffledOthers[1].syn.split(',')[0].trim() : "Trivial";
        const w3 = item.ant && item.ant !== "N/A" ? item.ant.split(',')[0].trim() : "Ordinary";
        const optionsSyn = [correctSyn, w1, w2, w3].sort(() => 0.5 - Math.random());

        examActiveQuestions.push({
          qId: `q-${i}-syn`,
          word: item.word,
          meaning: item.meaning,
          type: "Synonym",
          correctAns: correctSyn,
          options: optionsSyn
        });
      }

      // 2. Antonym Question
      if (item.ant && item.ant !== "N/A") {
        const correctAnt = item.ant.split(',')[0].trim();
        const otherWords = vocabData.filter(v => v.word !== item.word && v.ant && v.ant !== "N/A");
        const shuffledOthers = [...otherWords].sort(() => 0.5 - Math.random());
        const w1 = shuffledOthers[0].ant.split(',')[0].trim();
        const w2 = shuffledOthers[1] ? shuffledOthers[1].ant.split(',')[0].trim() : "Significant";
        const w3 = item.syn && item.syn !== "N/A" ? item.syn.split(',')[0].trim() : "Genuine";
        const optionsAnt = [correctAnt, w1, w2, w3].sort(() => 0.5 - Math.random());

        examActiveQuestions.push({
          qId: `q-${i}-ant`,
          word: item.word,
          meaning: item.meaning,
          type: "Antonym",
          correctAns: correctAnt,
          options: optionsAnt
        });
      }
    });

    // Randomize all questions order
    examActiveQuestions = examActiveQuestions.sort(() => 0.5 - Math.random());
  }

  examScore = 0;
  examAnsweredCount = 0;
  examWrongQuestions = [];

  renderExamUI();
}

            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px;">
            ${q.options.map(opt => `

                ${opt}
              </button>
            `).join('')}
          </div>
          <div id="feed-${q.qId}" style="display: none; margin-top: 12px; font-size: 0.9rem; font-weight: 600; padding: 8px 12px; border-radius: 8px;"></div>

    </div>
  `;
}

function handleOptionSelect(btn, qId, chosenRaw, answerRaw) {
  const chosen = decodeURIComponent(chosenRaw);
  const correct = decodeURIComponent(answerRaw);
  const card = document.getElementById(`card-${qId}`);
  const feed = document.getElementById(`feed-${qId}`);

  // Disable all buttons in this card
  const allBtns = card.querySelectorAll(`.exam-btn-${qId}`);
  allBtns.forEach(b => {
    b.disabled = true;
    b.style.cursor = 'default';
  });

  examAnsweredCount++;
  const matchedQuestion = examActiveQuestions.find(q => q.qId === qId);

  if (chosen.toLowerCase() === correct.toLowerCase()) {
    examScore++;
    btn.style.background = '#10b981';
    btn.style.color = '#ffffff';
    btn.style.borderColor = '#10b981';
    feed.innerText = '✓ চমৎকার! সঠিক উত্তর।';
    feed.style.background = '#ecfdf5';
    feed.style.color = '#065f46';
  } else {
    btn.style.background = '#ef4444';
    btn.style.color = '#ffffff';
    btn.style.borderColor = '#ef4444';

    // Highlight correct answer
    allBtns.forEach(b => {
      if (b.innerText.trim().toLowerCase() === correct.toLowerCase()) {
        b.style.background = '#10b981';
        b.style.color = '#ffffff';
        b.style.borderColor = '#10b981';
      }
    });

    feed.innerText = `✗ ভুল উত্তর! সঠিক উত্তর: "${correct}"`;
    feed.style.background = '#fef2f2';
    feed.style.color = '#991b1b';

    // Save for targeted retake
    if (matchedQuestion) {
      examWrongQuestions.push(matchedQuestion);
    }
  }

  feed.style.display = 'block';

  // Update Live Score
  const scoreBadge = document.getElementById('live-score-badge');
  if (scoreBadge) {
    scoreBadge.innerText = `Score: ${examScore} / ${examActiveQuestions.length}`;
  }

  // Check if exam completed
  if (examAnsweredCount === examActiveQuestions.length) {
    displayBatchResult();
  }
}

  const isAllCorrect = examScore === total;

    <div style="font-size: 3.2rem; margin-bottom: 8px;">${isAllCorrect ? '🏆' : '🎯'}</div>

        : `তোমার মোট ${examWrongQuestions.length} টি উত্তরে ভুল হয়েছিল। ভুলগুলো আবার প্র্যাকটিস করে ১০০% করে নাও!`}
    </p>

    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">

        <button onclick="retakeWrongQuestionsOnly()" style="background: #ef4444; color: #fff; border: none; padding: 12px 24px; border-radius: 9px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);">
          🔄 Practice Mistakes (${examWrongQuestions.length} Wrong Questions)
        </button>
      ` : ''}

      ${isAllCorrect && hasNextGoal ? `
        <button onclick="startVocabExam(${examCurrentBatchIndex + 1})" style="background: #10b981; color: #fff; border: none; padding: 12px 26px; border-radius: 9px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);">
          🚀 Go for Next Goal (${examBatches[examCurrentBatchIndex + 1].name}) →
        </button>
      ` : ''}

      <button onclick="startVocabExam(${examCurrentBatchIndex})" style="background: #4f46e5; color: #fff; border: none; padding: 12px 20px; border-radius: 9px; font-weight: 600; cursor: pointer; font-family: inherit;">
        🔁 Restart This Goal
      </button>

      <button onclick="navigateTo('english-lec1')" style="background: var(--bg); border: 1px solid var(--border); color: var(--text-main); padding: 12px 20px; border-radius: 9px; font-weight: 600; cursor: pointer; font-family: inherit;">
        📖 Read Lesson Again
      </button>
    </div>
  `;

  resBox.scrollIntoView({ behavior: 'smooth' });
}

function retakeWrongQuestionsOnly() {
  if (examWrongQuestions.length === 0) return;
  const listToRetake = [...examWrongQuestions];
  startVocabExam(examCurrentBatchIndex, listToRetake);
}

            </div>

function getSavedHomeworkDates() {
  const saved = localStorage.getItem('sambook_hw_data_v2');
  if (saved) {
    try { return JSON.parse(saved); } catch(e) {}
  }
  return [
    { date: "10-10-26", status: "pending" }
  ];
}

function saveHomeworkDates(dataList) {
  localStorage.setItem('sambook_hw_data_v2', JSON.stringify(dataList));
}

function addNewHomeworkDate() {
  const input = document.getElementById('new-hw-date-input');
  if (!input || !input.value.trim()) return;

  const rawDate = input.value.trim();
  let formattedDate = rawDate;

  if (rawDate.includes('-') && rawDate.split('-')[0].length === 4) {
    const parts = rawDate.split('-');
    formattedDate = `${parts[2]}-${parts[1]}-${parts[0].slice(-2)}`;
  }

  const currentList = getSavedHomeworkDates();
  const exists = currentList.some(item => item.date === formattedDate);
  if (!exists) {
    currentList.unshift({ date: formattedDate, status: "pending" });
    saveHomeworkDates(currentList);
    renderTeacherDashboard();
  } else {
    alert('Ei date ti already list-e ache!');
  }
}

function deleteHomeworkDate(dateStr) {
  if (!confirm(`${dateStr} tarikh-er record ti delete korte chan?`)) return;
  let currentList = getSavedHomeworkDates();
  currentList = currentList.filter(item => item.date !== dateStr);
  saveHomeworkDates(currentList);
  renderTeacherDashboard();
}

function setHWStatus(dateStr, newStatus) {
  let currentList = getSavedHomeworkDates();
  const target = currentList.find(item => item.date === dateStr);
  if (target) {
    target.status = newStatus;
    saveHomeworkDates(currentList);
  }
  renderTeacherDashboard();
  generateHWStatus(newStatus, dateStr);
}

        <div style="font-weight: 700; color: #9f1239; font-size: 0.95rem; margin-bottom: 8px;">⚠️ ১. স্টুডেন্ট অ্যালার্ট মেসেজ (Warning)</div>
        <div id="msg-text-alert" style="white-space: pre-line; background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #ffe4e6; font-size: 0.9rem; color: #1e293b; line-height: 1.6;">${studentAlertMsg}</div>
        <div style="display: flex; gap: 10px; margin-top: 12px;">
          <button onclick="copyToClipboard('msg-text-alert', this)" style="flex: 1; background: #e11d48; color: white; border: none; padding: 9px; border-radius: 7px; font-weight: 600; cursor: pointer;">📋 Copy Text</button>
          <button onclick="sendToWhatsApp('msg-text-alert')" style="flex: 1; background: #25d366; color: white; border: none; padding: 9px; border-radius: 7px; font-weight: 600; cursor: pointer;">💬 Send to WhatsApp</button>
        </div>
      </div>

      <!-- Guardian Notice -->
      <div style="background: #fefce8; border: 1px solid #fef08a; border-radius: 12px; padding: 16px; margin-top: 15px;">
        <div style="font-weight: 700; color: #854d0e; font-size: 0.95rem; margin-bottom: 8px;">📢 ২. অভিভাবকের জন্য নোটিশ (Guardian Notice)</div>
        <div id="msg-text-guardian" style="white-space: pre-line; background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #fef9c3; font-size: 0.9rem; color: #1e293b; line-height: 1.6;">${guardianMsg}</div>
        <div style="display: flex; gap: 10px; margin-top: 12px;">
          <button onclick="copyToClipboard('msg-text-guardian', this)" style="flex: 1; background: #ca8a04; color: white; border: none; padding: 9px; border-radius: 7px; font-weight: 600; cursor: pointer;">📋 Copy Text</button>
          <button onclick="sendToWhatsApp('msg-text-guardian')" style="flex: 1; background: #25d366; color: white; border: none; padding: 9px; border-radius: 7px; font-weight: 600; cursor: pointer;">💬 Send to WhatsApp</button>
        </div>
      </div>
    `;
  }

  box.style.display = 'block';
  box.scrollIntoView({ behavior: 'smooth' });
}

function copyToClipboard(elementId, btn) {
  const text = document.getElementById(elementId).innerText;
  navigator.clipboard.writeText(text).then(() => {
    const originalText = btn.innerText;
    btn.innerText = '✓ Copied!';
    setTimeout(() => {
      btn.innerText = originalText;
    }, 2000);
  });
}

function sendToWhatsApp(elementId) {
  const text = document.getElementById(elementId).innerText;
  const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('sambook_theme', isDark ? 'dark' : 'light');
  updateThemeIcon(isDark);
}

function updateThemeIcon(isDark) {
  const btn = document.getElementById('theme-btn');
  if (btn) {
    btn.innerText = isDark ? '☀️' : '🌙';
  }
}

// Page Load-e ager saved theme check kora
(function initTheme() {
  const savedTheme = localStorage.getItem('sambook_theme');
  const isDark = savedTheme === 'dark';
  if (isDark) {
    document.body.classList.add('dark-mode');
  }
  updateThemeIcon(isDark);
})();
</script>
</body>
</html>
