  <style>
    :root {

      --text-main: #0f172a;
      --text-muted: #64748b;
      --syn-color: #059669;
      --syn-bg: #ecfdf5;
      --ant-color: #dc2626;

      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', 'Hind Siliguri', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 35px 20px;

    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 25px; }
    header h1 { font-size: 2.2rem; font-weight: 700; color: #1e1b4b; }
    header p { color: var(--text-muted); font-size: 1rem; margin-top: 5px; }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      background: #fff;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .stats {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      background: #eef2ff;
      padding: 6px 14px;
      border-radius: 20px;
    }
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .vocab-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
    }
    .word-text { font-size: 1.25rem; font-weight: 700; color: #1e293b; }
    .meaning-badge {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary);
      background: #f5f3ff;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .section-block {
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.88rem;
    }
    .synonyms { background: var(--syn-bg); border-left: 4px solid var(--syn-color); }
    .antonyms { background: var(--ant-bg); border-left: 4px solid var(--ant-color); }
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .synonyms .section-title { color: var(--syn-color); }
    .antonyms .section-title { color: var(--ant-color); }
    .tags { color: #334155; line-height: 1.4; }
  </style>

    function renderVocab() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('vocabGrid');
      grid.innerHTML = "";

      const filtered = vocabData.filter(item => 
        item.word.toLowerCase().includes(query) ||
        item.meaning.toLowerCase().includes(query) ||
        item.syn.toLowerCase().includes(query) ||
        item.ant.toLowerCase().includes(query)
      );

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'vocab-card';
        card.innerHTML = `
          <div class="word-header">
            <span class="word-text">${item.word}</span>
            <span class="meaning-badge">${item.meaning}</span>

            <div class="tags">${item.ant}</div>
          </div>

        grid.appendChild(card);
      });

      document.getElementById('wordCount').innerText = `Showing: ${filtered.length} Words`;
